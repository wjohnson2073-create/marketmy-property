services:
  marketmyproperty:
    image: ghcr.io/wjohnson2073-create/marketmy-property:latest
    pull_policy: always
    container_name: MarketMyProperty
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    labels:
      - traefik.enable=true
      - traefik.http.routers.marketmyproperty.rule=Host(`marketmy.property`) || Host(`www.marketmy.property`)
      - traefik.http.routers.marketmyproperty.entrypoints=websecure
      - traefik.http.routers.marketmyproperty.tls=true
      - traefik.http.routers.marketmyproperty.tls.certresolver=letsencrypt
      - traefik.http.services.marketmyproperty.loadbalancer.server.port=3000
